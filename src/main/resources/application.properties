spring.application.name=usiu-campus-event-management
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/usiu_events?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Nairobi}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Nairobi
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

app.jwt.secret=${JWT_SECRET:Y2FtcHVzLWV2ZW50LW1hbmFnZW1lbnQtc3lzdGVtLXNlY3JldC1rZXktMzItYnl0ZXM=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.notifications.email-enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
app.demo.seed-password-hardening-enabled=${DEMO_SEED_PASSWORD_HARDENING_ENABLED:true}
app.uploads.dir=${UPLOADS_DIR:./uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
